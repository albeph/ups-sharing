# =====================================================================
# SMTP PROVIDER: GOOGLE GMAIL
# =====================================================================
# Requires a 16-character Google App Password (not your normal account password).
# Generate one at: https://myaccount.google.com/apppasswords

PROVIDER_NAME="Google Gmail"
SMTP_HOST="smtp.gmail.com"
SMTP_PORT="587"
SMTP_TLS="on"
SMTP_STARTTLS="on"
SMTP_AUTH="on"
REQUIRES_PASSWORD="yes"
PASSWORD_HELP="Enter your 16-character Google App Password (from https://myaccount.google.com/apppasswords): "
